name: Build & Validate Skillsdotmd

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate SKILL.md files
        run: |
          echo "Checking SKILL.md files..."
          count=0
          for f in $(find .agents/skills -name "SKILL.md" -type f 2>/dev/null); do
            if head -1 "$f" | grep -q "^---"; then
              echo "  PASS: $f"
            else
              echo "  WARN: $f - missing frontmatter"
            fi
            count=$((count+1))
          done
          echo "Validated $count skill files"

  build-app:
    runs-on: ubuntu-latest
    needs: validate-skills
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx next build
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/test"
          STRIPE_SECRET_KEY: "sk_test_placeholder"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
